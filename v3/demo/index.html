<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КИВО 2026 v3</title><style>body{font-family:Arial;max-width:1100px;margin:30px auto;padding:0 20px;background:#f7f8fa;color:#17202a}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}select{padding:10px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:12px;background:#e8ebef;border-radius:8px}.fill{height:100%;background:#667eea;border-radius:8px}.row{margin:12px 0}.person{padding:10px 0;border-top:1px solid #eee}.metric{font-size:32px;font-weight:bold}.tag{display:inline-block;padding:5px 8px;margin:3px;background:#eef2ff;border-radius:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><body><h1>Цифровой навигатор потенциала образовательных организаций</h1><p>v3 — поиск компетенций для проектной задачи и расчёт покрытия проекта</p><div class="card"><h2>1. Проектная задача → требуемые компетенции</h2><select id="task"></select><div id="req"></div></div><div class="grid"><div class="card"><h2>2. Покрытие проекта</h2><div id="cov" class="metric"></div><p>коллективная обеспеченность требуемых компетенций</p><div id="prof"></div></div><div class="card"><h2>3. Поиск экспертизы</h2><div id="people"></div></div></div><div class="card"><h2>4. Белые пятна</h2><div id="gaps"></div></div><script>const names={AI:'Искусственный интеллект',DATA:'Анализ данных',EDU_AI:'ИИ в образовании',MATH:'Математическое моделирование',ENG:'Инженерно-аналитические методы',PROJECT:'Управление образовательными и исследовательскими проектами'};const P=[{id:'P01',role:'ученый-преподаватель',c:{AI:.82,DATA:.91,EDU_AI:.78,MATH:.88,ENG:.30,PROJECT:.62}},{id:'P02',role:'преподаватель',c:{AI:.72,DATA:.54,EDU_AI:.95,MATH:.45,ENG:.18,PROJECT:.74}},{id:'P03',role:'ученый',c:{AI:.46,DATA:.82,EDU_AI:.25,MATH:.74,ENG:.88,PROJECT:.51}},{id:'P04',role:'ученый-преподаватель',c:{AI:.88,DATA:.76,EDU_AI:.81,MATH:.40,ENG:.33,PROJECT:.66}},{id:'P05',role:'преподаватель',c:{AI:.34,DATA:.61,EDU_AI:.69,MATH:.58,ENG:.20,PROJECT:.90}}];const T=[{n:'Проект по ИИ в образовании',g:{AI:.8,EDU_AI:1,DATA:.6,PROJECT:.6}},{n:'Проект по анализу цифровых данных',g:{DATA:1,MATH:.7,AI:.6,PROJECT:.5}},{n:'Инженерно-аналитический проект',g:{ENG:1,DATA:.8,MATH:.7,PROJECT:.5}}];const sel=document.querySelector('#task');T.forEach((t,i)=>sel.add(new Option(t.n,i)));function agg(){let a={};Object.keys(names).forEach(k=>a[k]=1-P.reduce((z,p)=>z*(1-(p.c[k]||0)),1));return a}function cos(a,b){let d=0,x=0,y=0;Object.keys(names).forEach(k=>{d+=(a[k]||0)*(b[k]||0);x+=(a[k]||0)**2;y+=(b[k]||0)**2});return d/(Math.sqrt(x*y)||1)}function render(){let t=T[sel.value],g=t.g,a=agg(),den=0,num=0;Object.entries(g).forEach(([k,v])=>{den+=v;num+=v*Math.min(a[k]/v,1)});document.querySelector('#cov').textContent=(100*num/den).toFixed(1)+'%';document.querySelector('#req').innerHTML=Object.entries(g).map(([k,v])=>`<span class=tag>${names[k]}: ${v.toFixed(1)}</span>`).join('');document.querySelector('#prof').innerHTML=Object.entries(names).map(([k,n])=>`<div class=row>${n}: ${(a[k]*100).toFixed(0)}%<div class=bar><div class=fill style=width:${a[k]*100}%></div></div></div>`).join('');document.querySelector('#people').innerHTML=P.map(p=>({p,fit:cos(p.c,g)})).sort((a,b)=>b.fit-a.fit).slice(0,3).map((x,i)=>`<div class=person><b>${i+1}. ${x.p.id}</b> — ${x.p.role}<br>Релевантность проекту: ${(x.fit*100).toFixed(1)}%</div>`).join('');let gs=Object.entries(g).map(([k,v])=>[k,Math.max(v-a[k],0)]).filter(x=>x[1]>.02).sort((x,y)=>y[1]-x[1]);document.querySelector('#gaps').innerHTML=gs.length?gs.map(x=>`<p><b>${names[x[0]]}</b>: дефицит ${(x[1]*100).toFixed(1)} п.п.</p>`).join(''):'<p>Существенных дефицитов нет.</p>'}sel.onchange=render;render();</script></body></html>
